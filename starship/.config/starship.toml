add_newline = false

[character]
success_symbol = "➜ "
error_symbol = "✗ "
# keep it neutral so the folder/git colors stand out

# username forces itself visible when the shell is elevated (Administrator on
# Windows, root elsewhere). Never useful -- always hide it.
[username]
disabled = true

# hostname is invisible locally and appears only over SSH, so the prompt on the
# Mac and Windows is unchanged while a remote box announces itself.
[hostname]
disabled = false
ssh_only = true
format = "[@$hostname]($style) "
style = "bold #E59866"   # amber, deliberately unlike the wisteria used locally
trim_at = "."            # linux-dev2-justin, not the full FQDN

[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold #C9A0DC"  # Wisteria color for folder

[git_branch]
symbol = ""
style = "bold #A084C9"  # Slightly darker shade of wisteria

[git_state]
style = "bold #A084C9"

[git_status]
conflicted = "!"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
staged = "+"
modified = "~"
untracked = "?"
renamed = "»"
deleted = "✖"
style = "#A084C9"

[nodejs]
disabled = true

[bun]
disabled = true

[time]
disabled = true

[battery]
disabled = true

[jobs]
disabled = true
